{% extends 'base.html' %}
{% block content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<div class="container mt-5">
    <h2 class="mb-4 text-center">Редактировать документ</h2>
    
    <form method="POST">
        <div class="mb-4">
            <label for="new_name" class="form-label">Новое имя документа:</label>
            <input type="text" id="new_name" name="new_name" class="form-control" value="{{ document.name }}" required>
        </div>

        <button type="submit" class="btn btn-success mb-3">Сохранить изменения</button>
    </form>

    <div class="text-center mb-4">
        <h4>Всего иероглифов: {{ characters | length }}</h4>
    </div>

    <!-- Alert для уведомлений -->
    <div id="alert-container" class="mb-3"></div>

    <div class="row">
        <div class="col-md-3 mb-3">
            <!-- Кнопка удаления выбранных иероглифов слева от таблицы -->
            <button type="button" class="btn btn-danger mt-3" id="delete-selected-button" style="width: 100%;">
                <i class="fas fa-trash-alt me-2"></i> Удалить выбранные
            </button>
        </div>
        
        <!-- Таблица с иероглифами -->
        <div class="col-md-9">
            <form id="character-form">
                <div class="table-responsive">
                    <table class="table table-striped table-hover text-center">
                        <thead class="thead-dark">
                            <tr>
                                <th>№</th>
                                <th>Иероглиф</th>
                                <th class="text-end">
                                    Выбор 
                                    <input type="checkbox" id="select-all" class="form-check-input" style="margin-left: 10px; transform: scale(1.5);">
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for char in characters %}
                                <tr>
                                    <td>{{ loop.index }}</td>
                                    <td class="character-text">{{ char.char }}</td> <!-- Измените, если у вас другая структура -->
                                    <td class="text-end">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" name="selected_chars" value="{{ char.id }}" id="checkbox-{{ loop.index }}" style="transform: scale(1.5);">
                                        </div>
                                    </td>
                                </tr>
                            {% else %}
                                <tr>
                                    <td colspan="3">Нет доступных иероглифов</td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </form>
        </div>
    </div>

    <!-- JS логика -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Обработчик для выбора всех чекбоксов
        document.getElementById('select-all').addEventListener('change', function() {
            const isChecked = this.checked;
            document.querySelectorAll('input[name="selected_chars"]').forEach(checkbox => {
                checkbox.checked = isChecked; // Устанавливаем состояние чекбоксов в соответствии с состоянием "Выбрать все"
            });
        });

        // Обработчик для удаления выбранных иероглифов
        document.getElementById('delete-selected-button').addEventListener('click', function() {
            const selectedIds = Array.from(document.querySelectorAll('input[name="selected_chars"]:checked'))
                .map(input => input.value);

            if (selectedIds.length === 0) {
                showAlert('Пожалуйста, выберите хотя бы один иероглиф для удаления.');
                return;
            }

            const confirmDelete = confirm('Вы уверены, что хотите удалить выбранные иероглифы?');
            if (!confirmDelete) return;

            const documentId = '{{ document.id }}';  // Получаем ID документа

            fetch(`/delete_selected/${documentId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ ids: selectedIds })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Ошибка сети: ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    showAlert('Выбранные иероглифы успешно удалены.');
                    setTimeout(() => location.reload(), 1000);  // Перезагрузка страницы через 1 сек
                } else {
                    showAlert(data.error || 'Ошибка при удалении иероглифов.');
                }
            })
            .catch(error => {
                showAlert('Произошла ошибка при удалении: ' + error.message);
            });
        });

        function showAlert(message) {
            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = `<div class="alert alert-warning alert-dismissible fade show" role="alert" style="font-size: 1.5rem; padding: 15px;">
                                            <i class="fas fa-exclamation-circle me-2"></i> ${message}
                                        </div>`;

            // Убираем уведомление через 5 секунд
            setTimeout(() => {
                const alert = alertContainer.querySelector('.alert');
                if (alert) {
                    alert.classList.remove('show');
                    alert.classList.add('fade');
                    setTimeout(() => alert.remove(), 500); // Удаляем после анимации
                }
            }, 5000);
        }
        // Обработчик для удаления выбранных иероглифов
document.getElementById('delete-selected-button').addEventListener('click', function() {
    const selectedIds = Array.from(document.querySelectorAll('input[name="selected_chars"]:checked'))
        .map(input => input.value);

    if (selectedIds.length === 0) {
        showAlert('Пожалуйста, выберите хотя бы один иероглиф для удаления.');
        return;
    }

    if (!confirmDelete) return;

    const documentId = '{{ document.id }}';  // Получаем ID документа

    fetch(`/delete_selected/${documentId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ ids: selectedIds })

    .then(response => {
        if (!response.ok) {
            throw new Error('Ошибка сети: ' + response.statusText);
        }
        return response.json();
    })
    .then(data => {
        if (data.success) {
            showAlert('Выбранные иероглифы успешно удалены.');
            // Обновление таблицы с оставшимися иероглифами
            updateGlyphTable(data.remaining_chars);
            setTimeout(() => location.reload(), 1000);  // Перезагрузка страницы через 1 сек
        } else {
            showAlert(data.error || 'Ошибка при удалении иероглифов.');
        }
    })
    .catch(error => {
        showAlert('Произошла ошибка при удалении: ' + error.message);
    });

});

// Функция для обновления таблицы с иероглифами
function updateGlyphTable(remainingChars) {
    const tableBody = document.querySelector('tbody');
    tableBody.innerHTML = ''; // Очищаем текущее содержимое таблицы

    remainingChars.forEach((char, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${index + 1}</td>
            <td class="character-text">${char}</td>
            <td class="text-end">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="selected_chars" value="${char}" id="checkbox-${index + 1}" style="transform: scale(1.5);">
                </div>
            </td>
        `;
        tableBody.appendChild(row); // Добавляем новую строку в таблицу
    });
}

    </script>

    <style>
        .character-text {
            font-size: 1.5rem; /* Увеличиваем размер шрифта иероглифов */
            color: #333;
        }

        .table {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .table th {
            background-color: #007bff;
            color: #ffffff;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #f2f2f2;
        }

        .table-hover tbody tr:hover {
            background-color: #e0f7fa;
        }
    </style>
</div>

{% endblock %}
